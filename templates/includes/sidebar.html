<!-- Sidebar Backdrop (mobile) -->
<div id="sidebarOverlay" onclick="closeSidebar()"></div>

<div id="sidebar">
  <div class="sidebar-brand">
    <h4><i class="bi bi-bank me-2"></i>Thimi Investment</h4>
    <button class="sidebar-close" onclick="closeSidebar()" aria-label="Close menu">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <a href="{% url 'admin_dashboard' %}"
    class="{% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
    <i class="bi bi-speedometer2"></i>
    Dashboard
  </a>

  <a href="{% url 'member_list' %}" class="{% if 'member' in request.resolver_match.url_name %}active{% endif %}">
    <i class="bi bi-people"></i>
    Members
  </a>

  <a href="{% url 'admin_deposits' %}"
    class="{% if request.resolver_match.url_name == 'admin_deposits' %}active{% endif %}">
    <i class="bi bi-wallet2"></i>
    Deposits
  </a>

  <a href="{% url 'admin_loans' %}" class="{% if request.resolver_match.url_name == 'admin_loans' %}active{% endif %}">
    <i class="bi bi-cash-stack"></i>
    Loans
  </a>

  <a href="{% url 'admin_investments' %}"
    class="{% if request.resolver_match.url_name == 'admin_investments' %}active{% endif %}">
    <i class="bi bi-graph-up-arrow"></i>
    Investments
  </a>

  <a href="{% url 'admin_reports' %}"
    class="{% if request.resolver_match.url_name == 'admin_reports' %}active{% endif %}">
    <i class="bi bi-file-earmark-bar-graph"></i>
    Reports
  </a>

  <a href="{% url 'admin_expenses' %}"
    class="{% if request.resolver_match.url_name == 'admin_expenses' %}active{% endif %}">
    <i class="bi bi-receipt text-danger"></i>
    Expenses
  </a>

  <a href="{% url 'admin_notifications' %}"
    class="{% if request.resolver_match.url_name == 'admin_notifications' %}active{% endif %}">
    <i class="bi bi-bell"></i>
    Notifications
  </a>

  <a href="{% url 'admin_settings' %}"
    class="{% if request.resolver_match.url_name == 'admin_settings' %}active{% endif %}">
    <i class="bi bi-gear"></i>
    Settings
  </a>
</div>
