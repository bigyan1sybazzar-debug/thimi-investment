<footer class="bg-white border-top mt-5 py-4">
    <div class="container-fluid px-4">
        <!-- Related Documents Section -->
        <div id="footerDocsContainer" class="mb-4" style="display: none;">
            <h6 class="text-uppercase fw-bold text-muted small mb-3">
                <i class="bi bi-file-earmark-pdf text-danger me-1"></i> Related Documents & Guidelines
            </h6>
            <div class="d-flex flex-wrap gap-2" id="footerDocsList">
                <!-- Dynamically populated -->
            </div>
        </div>

        <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 pt-2 border-top text-muted small">
            <div>
                © 2026 <strong>Thimi Investment Group</strong> — Financial Management System
            </div>
            <div class="d-flex gap-3 align-items-center">
                <span id="footerDocCountBadge" class="badge bg-light text-secondary border">0 Documents</span>
                <a href="#" class="text-secondary text-decoration-none"
                    onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">
                    <i class="bi bi-arrow-up-circle me-1"></i> Top
                </a>
            </div>
        </div>
    </div>
</footer>

<script>
    (function loadFooterDocuments() {
        fetch("/api/accounts/documents/")
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    const container = document.getElementById("footerDocsContainer");
                    const list = document.getElementById("footerDocsList");
                    const badge = document.getElementById("footerDocCountBadge");
                    if (container && list) {
                        container.style.display = "block";
                        if (badge) badge.innerText = `${data.length} Related Doc(s)`;
                        list.innerHTML = data.map(doc => `
                            <a href="${doc.file_url}" target="_blank" download class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1 shadow-sm px-3 py-1 bg-white">
                                <i class="bi bi-file-earmark-arrow-down text-primary fs-6"></i>
                                <span>${doc.title}</span>
                                ${doc.description ? `<small class="text-muted ms-1">(${doc.description})</small>` : ''}
                            </a>
                        `).join('');
                    }
                }
            })
            .catch(err => console.log("Footer documents load error:", err));
    })();
</script>
