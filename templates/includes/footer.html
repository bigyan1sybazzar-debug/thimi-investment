<footer class="bg-white border-top mt-5 py-4">
    <div class="container-fluid px-4">

        <!-- Related Documents Section -->
        <div id="footerDocsContainer" class="mb-4" style="display: none;">
            <h6 class="text-uppercase fw-bold text-muted small mb-3">
                <i class="bi bi-file-earmark-pdf text-danger me-1"></i> Related Documents &amp; Guidelines
            </h6>
            <div class="d-flex flex-wrap gap-2" id="footerDocsList">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Bottom bar -->
        <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 pt-2 border-top text-muted small">
            <div>
                &copy; 2026 <strong>Thimi Investment Group</strong> &mdash; Financial Management System
            </div>
            <div class="d-flex gap-3 align-items-center flex-wrap">
                <span id="footerDocCountBadge" class="badge bg-light text-secondary border"
                    style="display:none;"></span>
                <!-- Send Message to Admin — shown only when member is logged in -->
                <button id="footerMsgBtn" class="btn btn-sm btn-outline-primary d-none" data-bs-toggle="modal"
                    data-bs-target="#sendAdminMessageModal">
                    <i class="bi bi-envelope-plus me-1"></i> Send Message to Admin
                </button>
                <a href="#" class="text-secondary text-decoration-none"
                    onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">
                    <i class="bi bi-arrow-up-circle me-1"></i> Top
                </a>
            </div>
        </div>
    </div>
</footer>

<!-- ── Send Message to Admin Modal ───────────────────────────────── -->
<div class="modal fade" id="sendAdminMessageModal" tabindex="-1" aria-labelledby="sendAdminMessageModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <form id="sendAdminMsgForm">
                <div class="modal-header" style="background: linear-gradient(135deg,#1d3461,#2563eb); color:#fff;">
                    <h5 class="modal-title fw-bold" id="sendAdminMessageModalLabel">
                        <i class="bi bi-envelope-plus me-2"></i> Send Message to Admin
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div id="adminMsgAlert"></div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Subject *</label>
                        <input type="text" class="form-control form-control-sm" id="adminMsgSubject"
                            placeholder="e.g. Question about my deposit…" required maxlength="200">
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-semibold small text-muted">Message *</label>
                        <textarea class="form-control form-control-sm" id="adminMsgBody" rows="5"
                            placeholder="Type your message here…" required></textarea>
                    </div>
                    <small class="text-muted">
                        <i class="bi bi-info-circle me-1"></i>
                        Your message will appear in Admin &rsaquo; Notifications immediately.
                    </small>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm ms-auto" id="adminMsgSendBtn">
                        <i class="bi bi-send me-1"></i> Send
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // ── Related Documents ──────────────────────────────────────
    (function loadFooterDocuments() {
        fetch("/api/accounts/documents/")
            .then(res => res.json())
            .then(data => {
                if (!data || !data.length) return;
                const container = document.getElementById("footerDocsContainer");
                const list = document.getElementById("footerDocsList");
                const badge = document.getElementById("footerDocCountBadge");
                if (container && list) {
                    container.style.display = "block";
                    if (badge) { badge.style.display = ""; badge.innerText = data.length + " Doc(s)"; }
                    list.innerHTML = data.map(doc => `
                        <a href="${doc.file_url}" target="_blank"
                           class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1 shadow-sm px-3 py-1 bg-white">
                            <i class="bi bi-file-earmark-arrow-down text-primary fs-6"></i>
                            <span>${doc.title}</span>
                            ${doc.description ? `<small class="text-muted ms-1">(${doc.description})</small>` : ""}
                        </a>`).join("");
                }
            })
            .catch(() => { });
    })();

    // ── Show "Send Message" button only when token present ────
    (function initMsgButton() {
        const token = localStorage.getItem("access");
        const btn = document.getElementById("footerMsgBtn");
        if (token && btn) btn.classList.remove("d-none");
    })();

    // ── Handle message form submission ────────────────────────
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("sendAdminMsgForm");
        if (!form) return;

        form.addEventListener("submit", async function (e) {
            e.preventDefault();
            const btn = document.getElementById("adminMsgSendBtn");
            const alertDiv = document.getElementById("adminMsgAlert");
            const subject = (document.getElementById("adminMsgSubject").value || "").trim();
            const body = (document.getElementById("adminMsgBody").value || "").trim();

            if (!subject || !body) {
                alertDiv.innerHTML = `<div class="alert alert-warning py-2">Please fill in both fields.</div>`;
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>Sending…`;
            alertDiv.innerHTML = "";

            const token = localStorage.getItem("access");
            try {
                const res = await fetch("/api/notifications/send-message/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                    body: JSON.stringify({ subject, body })
                });
                const data = await res.json();
                if (res.ok) {
                    alertDiv.innerHTML = `<div class="alert alert-success py-2">
                        <i class="bi bi-check-circle-fill me-1"></i> ${data.message}
                    </div>`;
                    form.reset();
                    setTimeout(() => {
                        const m = bootstrap.Modal.getInstance(document.getElementById("sendAdminMessageModal"));
                        if (m) m.hide();
                        alertDiv.innerHTML = "";
                    }, 2000);
                } else {
                    alertDiv.innerHTML = `<div class="alert alert-danger py-2">
                        <i class="bi bi-x-circle-fill me-1"></i> ${data.detail || "Failed. Try again."}
                    </div>`;
                }
            } catch (err) {
                alertDiv.innerHTML = `<div class="alert alert-danger py-2">Connection error. Try again.</div>`;
            }

            btn.disabled = false;
            btn.innerHTML = `<i class="bi bi-send me-1"></i> Send`;
        });
    });
</script>
